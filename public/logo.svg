<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Premium Indigo Gradient for the V -->
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Clean Slate Gradient for the C -->
    <linearGradient id="slateGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4f46e5" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- No Background (Completely Transparent) -->
  
  <g filter="url(#shadow)">
    <!-- The V Shape (Sharp & Minimalist) -->
    <path d="M 125 100 L 256 360 L 387 100 L 315 100 L 256 220 L 197 100 Z" fill="url(#indigoGrad)" />
    
    <!-- The C Shape (Smooth & Curving, overlapping V gently) -->
    <path d="M 370 280 C 330 380 180 390 100 300 C 20 210 100 90 200 60 L 180 100 C 110 130 60 210 120 270 C 170 320 275 330 325 255 Z" fill="url(#slateGrad)" />
  </g>

  <!-- Typography -->
  <text x="256" y="445" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="200" fill="#1e293b" text-anchor="middle" letter-spacing="12">VARIETIES</text>
  <text x="256" y="485" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#4f46e5" text-anchor="middle" letter-spacing="18">COSMETICS</text>
</svg>